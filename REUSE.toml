SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
  "packages/core/**",
  "packages/contracts/**",
  "packages/integration-kit/**",
  "packages/design-tokens/**",
  "integrations/**",
  "e2e/**",
  "docs/**",
  ".agents/**",
  ".claude/**",
  "*.md",
  "REUSE.toml",
]
precedence = "aggregate"
