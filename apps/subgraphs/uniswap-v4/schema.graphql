type Token @entity(immutable: true) {
  id: Bytes!
  symbol: String!
  name: String!
  decimals: Int!
}

type Pool @entity(immutable: false) {
  id: Bytes!
  token0: Token!
  token1: Token!
  feeTier: Int!
  isDynamicFee: Boolean!
  tickSpacing: Int!
  hooks: Bytes!

  sqrtPriceX96: BigInt!
  tick: Int!
  liquidity: BigInt!

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

type Position @entity(immutable: false) {
  id: ID!

  owner: Bytes!

  pool: Pool

  tickLower: Int!
  tickUpper: Int!
  liquidity: BigInt!

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!

  closed: Boolean!
}
