type Token @entity(immutable: true) {
  id: Bytes!
  symbol: String!
  name: String!
  decimals: Int!
}

type Pool @entity(immutable: false) {
  id: Bytes!
  token0: Token!
  token1: Token!
  # For dynamic-fee pools feeTier holds the raw LPFeeLibrary flag 0x800000 (8388608);
  # check isDynamicFee before reading feeTier as a bps value.
  feeTier: Int!
  isDynamicFee: Boolean!
  tickSpacing: Int!
  hooks: Bytes!

  sqrtPriceX96: BigInt!
  tick: Int!
  # Active in-range liquidity as of the last Swap; 0 until the first swap (not refreshed on
  # ModifyLiquidity). Treat a pre-swap pool as unknown, not empty.
  liquidity: BigInt!

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

type Position @entity(immutable: false) {
  id: ID!

  owner: Bytes!

  pool: Pool

  tickLower: Int!
  tickUpper: Int!
  liquidity: BigInt!

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!

  closed: Boolean!
}
